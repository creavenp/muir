[package]
name = "muir"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Edge gateway for heterogeneous conservation sensor data"

[dependencies]
# Core types (PR 2). Each of these earns its keep in src/types.rs.
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
